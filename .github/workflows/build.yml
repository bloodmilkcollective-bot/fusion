name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name FusionVisualizer --collect-binaries pyaudiowpatch --hidden-import pyaudiowpatch fusion_visualizer.py
      - uses: actions/upload-artifact@v4
        with:
          name: FusionVisualizer
          path: dist/FusionVisualizer.exe
